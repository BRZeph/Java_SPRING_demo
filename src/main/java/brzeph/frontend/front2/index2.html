<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Register</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
        input, button { display: block; margin: 10px 0; padding: 10px; width: 100%; }
        .response { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<h2>Register</h2>
<input type="text" id="reg-username" placeholder="Username">
<input type="password" id="reg-password" placeholder="Password">
<button onclick="register()">Register</button>

<h2>Login</h2>
<input type="text" id="login-username" placeholder="Username">
<input type="password" id="login-password" placeholder="Password">
<button onclick="login()">Login</button>

<h2>Test Protected API</h2>
<button onclick="showUserData()">Create User</button>

<div class="response" id="responseBox"></div>

<script>
    const API_URL = 'http://localhost:8080/api';

    function showResponse(data) {
        document.getElementById("responseBox").innerText = JSON.stringify(data, null, 2);
    }

    async function register() {
        const username = document.getElementById("reg-username").value;
        const password = document.getElementById("reg-password").value;

        const response = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        showResponse(data);
    }

    async function login() {
        const username = document.getElementById("login-username").value;
        const password = document.getElementById("login-password").value;

        try {
            const response = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!response.ok) {
                throw new Error(`Login failed with status ${response.status}`);
            }

            const data = await response.json();
            console.log(data);  // Log the response body

            if (data.jwt) {
                localStorage.setItem("jwt", data.jwt);
            }

            showResponse(data);
        } catch (error) {
            console.error('Login error:', error);
        }
    }


    async function showUserData() {
        const token = localStorage.getItem("jwt");

        console.log("token -> " + token)

        const response = await fetch(`${API_URL}/auth/me`, {
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + token
            },
        });

        const data = await response.json();
        showResponse(data);
    }
</script>
</body>
</html>
